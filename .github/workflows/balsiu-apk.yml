name: Build Balsiu Lektuvas APK

on:
  push:
    branches:
      - chatgpt/balsiu-lektuvas-apk-build
    paths-ignore:
      - 'balsiu-apk/releases/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: balsiu-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply v1.22 changes
        run: python3 build_v122.py
      - name: Build debug APK with log
        id: apkbuild
        continue-on-error: true
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace > v122-build.log 2>&1
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish build diagnostics and APK
        if: always()
        run: |
          mkdir -p releases
          cp v122-build.log releases/v122-build.log || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk releases/BalsiuLektuvas-v1.22-debug.apk
            base64 -w 0 app/build/outputs/apk/debug/app-debug.apk > releases/BalsiuLektuvas-v1.22-debug.apk.b64
          fi
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add balsiu-apk/releases/v122-build.log balsiu-apk/releases/BalsiuLektuvas-v1.22-debug.apk balsiu-apk/releases/BalsiuLektuvas-v1.22-debug.apk.b64 2>/dev/null || true
          git commit -m "Publish BalsiuLektuvas v1.22 build output [skip ci]" || exit 0
          git push
