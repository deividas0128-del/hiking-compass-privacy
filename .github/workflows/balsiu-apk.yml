name: Build Balsiu Lektuvas APK

on:
  push:
    branches:
      - chatgpt/balsiu-lektuvas-apk-build
    paths-ignore:
      - 'balsiu-apk/releases/**'
  pull_request:
    branches:
      - chatgpt/balsiu-lektuvas-apk-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: balsiu-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply v1.22 changes
        run: python3 build_v122.py
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BalsiuLektuvas-v1.22-APK
          path: balsiu-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK to branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/BalsiuLektuvas-v1.22-debug.apk
          base64 -w 0 app/build/outputs/apk/debug/app-debug.apk > releases/BalsiuLektuvas-v1.22-debug.apk.b64
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add balsiu-apk/releases/BalsiuLektuvas-v1.22-debug.apk balsiu-apk/releases/BalsiuLektuvas-v1.22-debug.apk.b64
          git commit -m "Publish BalsiuLektuvas v1.22 APK and base64 [skip ci]" || exit 0
          git push
