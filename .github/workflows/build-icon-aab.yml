name: Build Hiking Compass icon AAB

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build proto resources and bundle
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          AAPT2="$BUILD_TOOLS/aapt2"
          ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          rm -rf out && mkdir -p out/old out/res/mipmap-mdpi out/res/mipmap-hdpi out/res/mipmap-xhdpi out/res/mipmap-xxhdpi out/res/mipmap-xxxhdpi
          unzip -q build-input/HikingCompass-v1.6-release.aab -d out/old
          cp build-input/ic_launcher_48.png out/res/mipmap-mdpi/ic_launcher.png
          cp build-input/ic_launcher_72.png out/res/mipmap-hdpi/ic_launcher.png
          cp build-input/ic_launcher_96.png out/res/mipmap-xhdpi/ic_launcher.png
          cp build-input/ic_launcher_144.png out/res/mipmap-xxhdpi/ic_launcher.png
          cp build-input/ic_launcher_192.png out/res/mipmap-xxxhdpi/ic_launcher.png

          cat > out/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="lt.zygiai.kompasas"
              android:versionCode="17"
              android:versionName="1.7.0"
              android:compileSdkVersion="36"
              android:compileSdkVersionCodename="16">
              <uses-sdk android:minSdkVersion="26" android:targetSdkVersion="36" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-feature android:name="android.hardware.sensor.compass" android:required="false" />
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />
              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="Hiking Compass"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          "$AAPT2" compile --dir out/res -o out/compiled.zip
          "$AAPT2" link --proto-format -o out/linked.apk -I "$ANDROID_JAR" --manifest out/AndroidManifest.xml -R out/compiled.zip
          mkdir -p out/linked out/bundle/base/manifest out/bundle/base/dex
          unzip -q out/linked.apk -d out/linked
          cp out/linked/AndroidManifest.xml out/bundle/base/manifest/AndroidManifest.xml
          cp out/linked/resources.pb out/bundle/base/resources.pb
          cp -r out/linked/res out/bundle/base/res
          cp out/old/base/dex/classes.dex out/bundle/base/dex/classes.dex
          cp out/old/BundleConfig.pb out/bundle/BundleConfig.pb
          cd out/bundle
          zip -q -r ../HikingCompass-v1.7-unsigned.aab BundleConfig.pb base

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: HikingCompass-v1.7-unsigned-aab
          path: out/HikingCompass-v1.7-unsigned.aab
          if-no-files-found: error
